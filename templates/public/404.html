{% extends "public/base.html" %}
{% block content %}
<section class="max-w-xl mx-auto px-6 py-32 text-center">
  <p class="font-serif text-7xl text-gold mb-6">404</p>
  <h1 class="font-serif text-3xl mb-4">Page Not Found</h1>
  <p class="text-charcoal/60 mb-10">{{ message if message else "The page you're looking for doesn't exist or has moved." }}</p>
  <a href="{{ url_for('home.index') }}"
     class="inline-block bg-charcoal text-cream px-8 py-3.5 rounded-full font-medium hover:bg-gold hover:text-charcoal transition-colors">
    Back to Home
  </a>
</section>
{% endblock %}
