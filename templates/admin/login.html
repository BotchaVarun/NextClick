<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | {{ site_name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="bg-charcoal min-h-screen flex items-center justify-center font-sans px-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="font-serif text-3xl text-cream">{{ site_name }}</h1>
      <p class="text-cream/50 text-sm mt-1">Admin Panel</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="mb-6 space-y-2">
        {% for category, message in messages %}
        <div class="px-4 py-3 rounded-md text-sm {{ 'bg-red-500/10 text-red-300 border border-red-500/30' if category == 'error' else 'bg-green-500/10 text-green-300 border border-green-500/30' }}">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_auth.login') }}" class="bg-cream rounded-xl p-8 space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-sm font-medium mb-1.5 text-charcoal">Email</label>
        <input type="email" name="email" required autofocus
               class="w-full border border-charcoal/20 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gold">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5 text-charcoal">Password</label>
        <input type="password" name="password" required
               class="w-full border border-charcoal/20 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gold">
      </div>
      <label class="flex items-center gap-2 text-sm text-charcoal/70">
        <input type="checkbox" name="remember" class="rounded"> Remember me
      </label>
      <button type="submit"
              class="w-full bg-charcoal text-cream py-3 rounded-full font-medium hover:bg-gold hover:text-charcoal transition-colors">
        Log In
      </button>
    </form>
  </div>
</body>
</html>
